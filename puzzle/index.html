<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="しゃしんパズル">
<meta name="theme-color" content="#bfe9ff">
<title>しゃしんパズル</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
    background:radial-gradient(#ffffff88 2px,transparent 3px) 0 0/40px 40px,linear-gradient(#bfe9ff,#e9f8ff 60%,#d6f5c9);
    color:#3b3a52;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  button{font:inherit;color:inherit;cursor:pointer;border:none}
  img,canvas{-webkit-user-drag:none}
  .screen{position:fixed;inset:0}
  [hidden]{display:none!important}

  /* ---------- しゃしんえらび ---------- */
  #select{overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + 24px) 40px calc(env(safe-area-inset-left) + 24px)}
  #select h1{margin:6px 0 22px;text-align:center;font-size:44px;letter-spacing:.08em;color:#ff7a59;
    text-shadow:3px 3px 0 #fff}
  #gear{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:calc(env(safe-area-inset-right) + 16px);
    width:64px;height:64px;border-radius:50%;background:#ffffffaa;font-size:30px;overflow:hidden;touch-action:none}
  #gear .fill{position:absolute;left:0;bottom:0;width:100%;height:0;background:#ff7a5966}
  #gear.holding .fill{animation:fillup 1.5s linear forwards}
  @keyframes fillup{to{height:100%}}
  #gear span{position:relative}

  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px;max-width:1200px;margin:0 auto}
  .tile{position:relative;aspect-ratio:4/3;border-radius:28px;border:7px solid #fff;background:#fff;
    box-shadow:0 8px 18px rgba(0,0,0,.18);overflow:hidden;transition:transform .15s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
  .tile .del{display:none;position:absolute;top:6px;right:6px;width:52px;height:52px;border-radius:50%;
    background:#ff5a5a;color:#fff;font-size:30px;font-weight:bold;box-shadow:0 3px 8px rgba(0,0,0,.3)}
  body.edit .tile .del{display:block}
  .tile.add{display:flex;align-items:center;justify-content:center;flex-direction:column;background:#fff8e6;
    border:7px dashed #ffb35a;font-size:28px;color:#e07b1a;font-weight:bold}
  .tile.add b{font-size:64px;line-height:1}

  #empty{text-align:center;font-size:24px;line-height:1.7;margin-top:60px;color:#5a6a85}
  #empty .big{font-size:80px}

  #editbar{display:none;max-width:1200px;margin:0 auto 22px;padding:16px 18px;border-radius:22px;background:#ffffffcc;
    align-items:center;gap:14px;flex-wrap:wrap;font-size:20px}
  body.edit #editbar{display:flex}
  #editbar .label{font-weight:bold}
  .seg{display:flex;border-radius:16px;overflow:hidden;border:3px solid #7ab8e8}
  .seg button{padding:12px 18px;background:#fff;font-size:20px}
  .seg button.on{background:#7ab8e8;color:#fff;font-weight:bold}
  #editDone{margin-left:auto;padding:12px 26px;border-radius:16px;background:#3b3a52;color:#fff;font-size:20px}

  /* ---------- パズル ---------- */
  #play{touch-action:none;overflow:hidden}
  #home{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:calc(env(safe-area-inset-left) + 14px);
    width:84px;height:84px;border-radius:26px;background:#fff;font-size:46px;z-index:5000;
    box-shadow:0 6px 14px rgba(0,0,0,.18)}
  #home:active{transform:scale(.92)}
  #board{position:absolute;border-radius:6px;box-shadow:0 0 0 8px #fff,0 10px 24px rgba(0,0,0,.2);z-index:0}
  #boardFull{position:absolute;opacity:0;transition:opacity .6s;z-index:4000;pointer-events:none;border-radius:6px}
  #boardFull.show{opacity:1}
  .piece{position:absolute;left:0;top:0;transform-origin:center;will-change:transform;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));pointer-events:none}
  .piece.drag{filter:drop-shadow(0 16px 14px rgba(0,0,0,.35))}
  .piece.glide{transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
  .piece.locked{filter:none}
  .piece.flash{animation:flash .6s}
  @keyframes flash{0%{filter:brightness(1.6) drop-shadow(0 0 18px #fff)}100%{filter:brightness(1) drop-shadow(0 0 0 #fff0)}}

  #confetti{position:absolute;inset:0;pointer-events:none;z-index:4500}
  #done{position:absolute;inset:0;z-index:4800;display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none}
  #done .msg{font-size:min(15vw,130px);font-weight:bold;color:#ff7a59;letter-spacing:.06em;
    text-shadow:0 0 0 #fff,5px 5px 0 #fff,-5px -5px 0 #fff,5px -5px 0 #fff,-5px 5px 0 #fff,0 10px 20px rgba(0,0,0,.25);
    animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
  #done .btns{display:flex;gap:28px;margin-top:30px;opacity:0;transition:opacity .4s;flex-wrap:wrap;justify-content:center}
  #done .btns.show{opacity:1;pointer-events:auto}
  #done .btns button{padding:22px 34px;border-radius:30px;font-size:32px;font-weight:bold;color:#fff;
    box-shadow:0 8px 0 rgba(0,0,0,.18)}
  #done .btns button:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
  #again{background:#ff9a3c}
  #others{background:#4fb3e8}
</style>
</head>
<body>

<!-- しゃしんえらび -->
<div id="select" class="screen">
  <button id="gear" aria-label="おとなのせってい（ながおし）"><div class="fill"></div><span>⚙️</span></button>
  <h1>しゃしんパズル</h1>
  <div id="editbar">
    <span class="label">むずかしさ</span>
    <div class="seg" id="diffSeg">
      <button data-d="2">かんたん（2）</button>
      <button data-d="4">ふつう（4）</button>
      <button data-d="6">むずかしい（6）</button>
    </div>
    <button id="editDone">おわる</button>
  </div>
  <div id="grid"></div>
  <div id="empty" hidden>
    <div class="big">🚃📷</div>
    おとなの ひとへ：<br>みぎうえの ⚙️ を ながおし して、<br>すきな しゃしんを いれてください。
  </div>
  <input id="file" type="file" accept="image/*" multiple hidden>
</div>

<!-- パズル -->
<div id="play" class="screen" hidden>
  <button id="home" aria-label="もどる">🏠</button>
  <canvas id="board"></canvas>
  <img id="boardFull" alt="">
  <canvas id="confetti"></canvas>
  <div id="done" hidden>
    <div class="msg">できたね！</div>
    <div class="btns">
      <button id="again">もういっかい</button>
      <button id="others">ほかの しゃしん</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const MAX_PHOTOS = 20;
  const GRID = { 2: [2, 1], 4: [2, 2], 6: [3, 2] };

  // ---------- 設定（難易度） ----------
  function loadDiff() {
    try { const v = +localStorage.getItem('puzzle.diff'); if (GRID[v]) return v; } catch (e) {}
    return 4;
  }
  function saveDiff(v) { try { localStorage.setItem('puzzle.diff', v); } catch (e) {} }
  let diff = loadDiff();

  // ---------- 写真の保存（IndexedDB） ----------
  let dbp = null;
  function openDB() {
    return dbp ||= new Promise((res, rej) => {
      const r = indexedDB.open('photo-puzzle', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function dbRun(mode, fn) {
    const db = await openDB();
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode);
      const req = fn(t.objectStore('photos'));
      t.oncomplete = () => res(req.result);
      t.onerror = () => rej(t.error);
    });
  }
  const dbAll = () => dbRun('readonly', s => s.getAll());
  const dbPut = o => dbRun('readwrite', s => s.put(o));
  const dbDel = id => dbRun('readwrite', s => s.delete(id));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  let photos = []; // {id, created, url, thumb}

  function toEntry(rec) {
    return {
      id: rec.id, created: rec.created,
      url: URL.createObjectURL(new Blob([rec.full], { type: 'image/jpeg' })),
      thumb: URL.createObjectURL(new Blob([rec.thumb], { type: 'image/jpeg' })),
    };
  }

  async function loadPhotos() {
    try {
      const recs = await dbAll();
      photos = recs.sort((a, b) => a.created - b.created).map(toEntry);
    } catch (e) { photos = []; }
    renderSelect();
  }

  function loadImg(src) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = rej;
      img.src = src;
    });
  }
  function shrink(img, max, q) {
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * s);
    c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return new Promise(r => c.toBlob(b => r(b.arrayBuffer()), 'image/jpeg', q));
  }

  async function addFiles(files) {
    for (const f of files) {
      if (photos.length >= MAX_PHOTOS) { alert(`しゃしんは ${MAX_PHOTOS}まい までです。いらない しゃしんを けしてください。`); break; }
      const src = URL.createObjectURL(f);
      try {
        const img = await loadImg(src);
        const rec = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
          created: Date.now(),
          full: await shrink(img, 1600, 0.88),
          thumb: await shrink(img, 480, 0.8),
        };
        await dbPut(rec);
        photos.push(toEntry(rec));
      } catch (e) {
        alert('この しゃしんは よみこめませんでした。');
      } finally { URL.revokeObjectURL(src); }
    }
    renderSelect();
  }

  async function removePhoto(id) {
    try { await dbDel(id); } catch (e) {}
    const i = photos.findIndex(p => p.id === id);
    if (i >= 0) { URL.revokeObjectURL(photos[i].url); URL.revokeObjectURL(photos[i].thumb); photos.splice(i, 1); }
    renderSelect();
  }

  // ---------- しゃしんえらび画面 ----------
  let editing = false;

  function renderSelect() {
    const grid = $('grid');
    grid.innerHTML = '';
    for (const p of photos) {
      const t = document.createElement('div');
      t.className = 'tile';
      t.innerHTML = `<img src="${p.thumb}" alt=""><button class="del" aria-label="けす">×</button>`;
      t.addEventListener('click', e => {
        if (e.target.closest('.del')) {
          if (confirm('この しゃしんを けしますか？')) removePhoto(p.id);
          return;
        }
        if (!editing) startPuzzle(p);
      });
      grid.append(t);
    }
    if (editing) {
      const a = document.createElement('div');
      a.className = 'tile add';
      a.innerHTML = '<b>＋</b>しゃしん';
      a.addEventListener('click', () => $('file').click());
      grid.append(a);
    }
    $('empty').hidden = editing || photos.length > 0;
    document.querySelectorAll('#diffSeg button').forEach(b => b.classList.toggle('on', +b.dataset.d === diff));
  }

  function setEditing(on) {
    editing = on;
    document.body.classList.toggle('edit', on);
    renderSelect();
  }

  // ⚙️ ながおし で おとなモード
  (() => {
    const g = $('gear');
    let timer = 0;
    const cancel = () => { clearTimeout(timer); g.classList.remove('holding'); };
    g.addEventListener('pointerdown', e => {
      e.preventDefault();
      g.classList.add('holding');
      timer = setTimeout(() => { cancel(); setEditing(true); }, 1500);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => g.addEventListener(t, cancel));
  })();
  $('editDone').addEventListener('click', () => setEditing(false));
  $('diffSeg').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    diff = +b.dataset.d;
    saveDiff(diff);
    renderSelect();
  });
  $('file').addEventListener('change', e => {
    const files = [...e.target.files];
    e.target.value = '';
    if (files.length) addFiles(files);
  });

  // ---------- おと ----------
  let ac = null;
  function audio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(freq, start, dur, type = 'sine', vol = 0.25) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + start;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function popSound() {
    const a = audio(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.setValueAtTime(500, t);
    o.frequency.exponentialRampToValueAtTime(1100, t + 0.08);
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + 0.2);
  }
  function fanfare() {
    [[523, 0], [659, .15], [784, .3], [1047, .45]].forEach(([f, s]) => tone(f, s, .3, 'triangle', .3));
    [523, 659, 784, 1047].forEach(f => tone(f, .7, 1.0, 'triangle', .18));
  }
  function say(text) {
    try {
      if (!window.speechSynthesis) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP'; u.pitch = 1.4; u.rate = 0.95;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  // ---------- ジグソーの かたち ----------
  // 辺の中央に出っぱり（s=1）／へこみ（s=-1）。u は辺に沿った位置、v は外向き（どちらも タブ半径 r 単位）
  const TAB = [
    [[-0.2, 0.3], [-0.65, 0.4], [-0.5, 0.7]],
    [[-0.4, 0.95], [-0.25, 1.05], [0, 1.05]],
    [[0.25, 1.05], [0.4, 0.95], [0.5, 0.7]],
    [[0.65, 0.4], [0.2, 0.3], [0.35, 0]],
  ];
  function edge(p, ax, ay, bx, by, s, r) {
    if (!s) { p.lineTo(bx, by); return; }
    const L = Math.hypot(bx - ax, by - ay), dx = (bx - ax) / L, dy = (by - ay) / L, nx = dy, ny = -dx, c = L / 2;
    const pt = (u, v) => [ax + dx * (c + u * r) + nx * v * r * s, ay + dy * (c + u * r) + ny * v * r * s];
    p.lineTo(...pt(-0.35, 0));
    for (const [c1, c2, e] of TAB) p.bezierCurveTo(...pt(...c1), ...pt(...c2), ...pt(...e));
    p.lineTo(bx, by);
  }
  // sides = [上, 右, 下, 左]
  function piecePath(w, h, pad, r, sides) {
    const p = new Path2D();
    const x0 = pad, y0 = pad, x1 = pad + w, y1 = pad + h;
    p.moveTo(x0, y0);
    edge(p, x0, y0, x1, y0, sides[0], r);
    edge(p, x1, y0, x1, y1, sides[1], r);
    edge(p, x1, y1, x0, y1, sides[2], r);
    edge(p, x0, y1, x0, y0, sides[3], r);
    p.closePath();
    return p;
  }

  // ---------- レイアウト ----------
  // ボードと ピースおきば を画面の長い方向に並べ、ピースが いちばん大きくなる わけかたを選ぶ
  function computeLayout(W, H, aspect, cols, rows, n) {
    const M = 16, TOP = 108;
    const RX = M, RY = TOP, RW = W - 2 * M, RH = H - TOP - M;
    const land = W >= H;
    let best = null;
    for (let f = 0.4; f <= 0.77; f += 0.03) {
      let bb, tb;
      if (land) { bb = { x: RX, y: RY, w: RW * f - 14, h: RH }; tb = { x: RX + RW * f + 14, y: RY, w: RW * (1 - f) - 14, h: RH }; }
      else { bb = { x: RX, y: RY, w: RW, h: RH * f - 14 }; tb = { x: RX, y: RY + RH * f + 14, w: RW, h: RH * (1 - f) - 14 }; }
      let bw = bb.w, bh = bw / aspect;
      if (bh > bb.h) { bh = bb.h; bw = bh * aspect; }
      const cw = bw / cols, ch = bh / rows;
      for (let tc = 1; tc <= n; tc++) {
        const tr = Math.ceil(n / tc);
        const s = Math.min(1, tb.w / (tc * cw * 1.3), tb.h / (tr * ch * 1.3));
        const score = bw * s;
        if (!best || score > best.score) best = { score, bb, tb, bw: bw * s, bh: bh * s, tc, tr };
      }
    }
    best.bx = best.bb.x + (best.bb.w - best.bw) / 2;
    best.by = best.bb.y + (best.bb.h - best.bh) / 2;
    return best;
  }

  // ---------- パズル ----------
  let P = null;
  let zTop = 10;
  const drags = new Map();
  const hitCtx = document.createElement('canvas').getContext('2d');
  const dpr = () => Math.min(2, window.devicePixelRatio || 1);

  async function startPuzzle(photo) {
    audio();
    const img = await loadImg(photo.url);
    const n = diff;
    let [cols, rows] = GRID[n];
    if (img.naturalHeight > img.naturalWidth) [cols, rows] = [rows, cols];
    const rnd = () => (Math.random() < 0.5 ? 1 : -1);
    P = {
      photo, img, cols, rows, n,
      hE: Array.from({ length: rows - 1 }, () => Array.from({ length: cols }, rnd)),
      vE: Array.from({ length: rows }, () => Array.from({ length: cols - 1 }, rnd)),
      locked: new Set(), pieces: [], done: false,
    };
    $('select').hidden = true;
    $('play').hidden = false;
    $('done').hidden = true;
    $('done').querySelector('.btns').classList.remove('show');
    $('boardFull').classList.remove('show');
    $('boardFull').src = photo.url;
    stopConfetti();
    build();
  }

  function build() {
    if (!P) return;
    drags.clear();
    P.pieces.forEach(pc => pc.el.remove());
    P.pieces = [];
    const W = window.innerWidth, H = window.innerHeight;
    const { img, cols, rows, n, hE, vE } = P;
    const L = computeLayout(W, H, img.naturalWidth / img.naturalHeight, cols, rows, n);
    const bw = L.bw, bh = L.bh, w = bw / cols, h = bh / rows;
    const r = 0.3 * Math.min(w, h);
    const pad = Math.ceil(r * 1.15) + 4;
    const d = dpr();
    Object.assign(P, { L, w, h, pad, r });

    // ボード（うすい おてほん ＋ ピースの わく）
    const bc = $('board');
    bc.width = Math.round(bw * d); bc.height = Math.round(bh * d);
    Object.assign(bc.style, { left: L.bx + 'px', top: L.by + 'px', width: bw + 'px', height: bh + 'px' });
    const bx = bc.getContext('2d');
    bx.setTransform(d, 0, 0, d, 0, 0);
    bx.fillStyle = '#fff';
    bx.fillRect(0, 0, bw, bh);
    bx.globalAlpha = 0.3;
    bx.drawImage(img, 0, 0, bw, bh);
    bx.globalAlpha = 1;
    const bf = $('boardFull');
    Object.assign(bf.style, { left: L.bx + 'px', top: L.by + 'px', width: bw + 'px', height: bh + 'px' });

    const sidesOf = (rr, cc) => [
      rr > 0 ? -hE[rr - 1][cc] : 0,
      cc < cols - 1 ? vE[rr][cc] : 0,
      rr < rows - 1 ? hE[rr][cc] : 0,
      cc > 0 ? -vE[rr][cc - 1] : 0,
    ];

    // おきばの すきま（ばらばらの順番）
    const slots = [];
    for (let i = 0; i < n; i++) {
      const sc = i % L.tc, sr = Math.floor(i / L.tc);
      const sw = L.tb.w / L.tc, sh = L.tb.h / L.tr;
      const jx = (Math.random() - 0.5) * Math.max(0, sw - w * 1.15) * 0.8;
      const jy = (Math.random() - 0.5) * Math.max(0, sh - h * 1.15) * 0.8;
      slots.push({ cx: L.tb.x + sw * (sc + 0.5) + jx, cy: L.tb.y + sh * (sr + 0.5) + jy });
    }
    for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }

    let k = 0;
    for (let rr = 0; rr < rows; rr++) {
      for (let cc = 0; cc < cols; cc++) {
        const path = piecePath(w, h, pad, r, sidesOf(rr, cc));
        // ボードに わくを えがく
        bx.save();
        bx.translate(cc * w - pad, rr * h - pad);
        bx.setLineDash([8, 6]);
        bx.lineWidth = 2.5;
        bx.strokeStyle = 'rgba(80,110,160,.55)';
        bx.stroke(path);
        bx.restore();

        const cw = w + 2 * pad, ch = h + 2 * pad;
        const el = document.createElement('canvas');
        el.className = 'piece';
        el.width = Math.round(cw * d); el.height = Math.round(ch * d);
        el.style.width = cw + 'px'; el.style.height = ch + 'px';
        const ctx = el.getContext('2d');
        ctx.setTransform(d, 0, 0, d, 0, 0);
        ctx.save();
        ctx.clip(path);
        ctx.drawImage(img, pad - cc * w, pad - rr * h, bw, bh);
        ctx.restore();
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255,255,255,.95)';
        ctx.stroke(path);

        const key = rr + ',' + cc;
        const tx = L.bx + cc * w - pad, ty = L.by + rr * h - pad;
        const pc = { key, rr, cc, el, path, tx, ty, x: 0, y: 0, z: 0, locked: P.locked.has(key) };
        if (pc.locked) {
          pc.x = tx; pc.y = ty;
          el.classList.add('locked');
          el.style.zIndex = 1;
        } else {
          const s = slots[k++];
          pc.x = Math.min(W - cw, Math.max(0, s.cx - cw / 2));
          pc.y = Math.min(H - ch, Math.max(0, s.cy - ch / 2));
          pc.z = ++zTop;
          el.style.zIndex = pc.z;
        }
        place(pc);
        $('play').append(el);
        P.pieces.push(pc);
      }
    }
    if (P.done) { $('boardFull').classList.add('show'); }
  }

  function place(pc, scale = 1) {
    pc.el.style.transform = `translate(${pc.x}px,${pc.y}px)` + (scale !== 1 ? ` scale(${scale})` : '');
  }

  function hitPiece(x, y) {
    const free = P.pieces.filter(pc => !pc.locked && !pc.dragging).sort((a, b) => b.z - a.z);
    for (const pc of free) {
      if (hitCtx.isPointInPath(pc.path, x - pc.x, y - pc.y)) return pc;
    }
    // かたちの すこし外を さわっても つかめるように
    const slack = 24;
    for (const pc of free) {
      const lx = x - pc.x, ly = y - pc.y;
      if (lx > P.pad - slack && lx < P.pad + P.w + slack && ly > P.pad - slack && ly < P.pad + P.h + slack) return pc;
    }
    return null;
  }

  const play = $('play');
  play.addEventListener('pointerdown', e => {
    if (!P || P.done || e.target.closest('button')) return;
    audio();
    const pc = hitPiece(e.clientX, e.clientY);
    if (!pc) return;
    e.preventDefault();
    pc.dragging = true;
    pc.z = ++zTop;
    pc.el.style.zIndex = pc.z;
    pc.el.classList.remove('glide');
    pc.el.classList.add('drag');
    drags.set(e.pointerId, { pc, dx: e.clientX - pc.x, dy: e.clientY - pc.y });
    try { play.setPointerCapture(e.pointerId); } catch (err) {}
    place(pc, 1.06);
  });
  play.addEventListener('pointermove', e => {
    const dg = drags.get(e.pointerId);
    if (!dg) return;
    const pc = dg.pc;
    const cw = P.w + 2 * P.pad, ch = P.h + 2 * P.pad;
    const W = window.innerWidth, H = window.innerHeight;
    pc.x = Math.min(W - cw / 2, Math.max(-cw / 2, e.clientX - dg.dx));
    pc.y = Math.min(H - ch / 2, Math.max(-ch / 2, e.clientY - dg.dy));
    place(pc, 1.06);
  });
  const drop = e => {
    const dg = drags.get(e.pointerId);
    if (!dg) return;
    drags.delete(e.pointerId);
    const pc = dg.pc;
    pc.dragging = false;
    pc.el.classList.remove('drag');
    const tol = Math.max(70, 0.45 * Math.min(P.w, P.h));
    if (Math.hypot(pc.x - pc.tx, pc.y - pc.ty) < tol) {
      pc.locked = true;
      P.locked.add(pc.key);
      pc.x = pc.tx; pc.y = pc.ty;
      pc.el.classList.add('glide', 'locked', 'flash');
      pc.el.style.zIndex = 1;
      place(pc);
      popSound();
      setTimeout(() => pc.el.classList.remove('flash'), 700);
      if (P.locked.size === P.pieces.length) setTimeout(celebrate, 350);
    } else {
      place(pc);
    }
  };
  play.addEventListener('pointerup', drop);
  play.addEventListener('pointercancel', drop);

  function celebrate() {
    if (!P || P.done) return;
    P.done = true;
    $('boardFull').classList.add('show');
    fanfare();
    setTimeout(() => say('できたね！ すごいね！'), 900);
    startConfetti();
    $('done').hidden = false;
    setTimeout(() => { if (P && P.done) $('done').querySelector('.btns').classList.add('show'); }, 1500);
  }

  function goHome() {
    stopConfetti();
    if (P) P.pieces.forEach(pc => pc.el.remove());
    P = null;
    drags.clear();
    $('play').hidden = true;
    $('select').hidden = false;
  }
  $('home').addEventListener('click', goHome);
  $('others').addEventListener('click', goHome);
  $('again').addEventListener('click', () => { if (P) startPuzzle(P.photo); });

  // ---------- かみふぶき ----------
  let confRAF = 0;
  function startConfetti() {
    const cv = $('confetti'), d = dpr();
    const W = window.innerWidth, H = window.innerHeight;
    cv.width = W * d; cv.height = H * d;
    const ctx = cv.getContext('2d');
    ctx.setTransform(d, 0, 0, d, 0, 0);
    const colors = ['#ff5a5a', '#ffb33c', '#ffe14d', '#5ad16b', '#4fb3e8', '#9b6bff', '#ff7ac6'];
    const parts = Array.from({ length: 160 }, () => ({
      x: Math.random() * W, y: -20 - Math.random() * H * 0.6,
      vx: (Math.random() - 0.5) * 2.5, vy: 2 + Math.random() * 3.5,
      s: 8 + Math.random() * 10, a: Math.random() * 6.28, va: (Math.random() - 0.5) * 0.3,
      c: colors[Math.floor(Math.random() * colors.length)],
    }));
    const t0 = performance.now();
    cancelAnimationFrame(confRAF);
    const step = now => {
      ctx.clearRect(0, 0, W, H);
      const fade = Math.min(1, Math.max(0, (5000 - (now - t0)) / 1000));
      ctx.globalAlpha = fade;
      for (const p of parts) {
        p.x += p.vx; p.y += p.vy; p.a += p.va;
        if (p.y > H + 20 && now - t0 < 3000) { p.y = -20; p.x = Math.random() * W; }
        ctx.save();
        ctx.translate(p.x, p.y); ctx.rotate(p.a);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore();
      }
      if (fade > 0) confRAF = requestAnimationFrame(step);
      else ctx.clearRect(0, 0, W, H);
    };
    confRAF = requestAnimationFrame(step);
  }
  function stopConfetti() {
    cancelAnimationFrame(confRAF);
    const cv = $('confetti');
    cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
  }

  // ---------- 画面の むき・おおきさ が かわったら つくりなおす ----------
  let rt = 0;
  window.addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => { if (P) build(); }, 200);
  });

  // ---------- かってに うごかないように ----------
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

  loadPhotos();
})();
</script>
